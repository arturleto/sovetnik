const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),u64=a=>btoa(String.fromCharCode(...a));
const f=document.getElementById('f');
async function show(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const d=b64(E.data);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12));
  const doc=new DOMParser().parseFromString(new TextDecoder().decode(pt),'text/html');
  document.replaceChild(document.adoptNode(doc.documentElement),document.documentElement);
  for(const o of [...document.querySelectorAll('script')]){
    const t=(o.getAttribute('type')||'').toLowerCase();
    if(t&&t!=='text/javascript'&&t!=='module')continue;
    const n=document.createElement('script');for(const a of o.attributes)n.setAttribute(a.name,a.value);
    n.textContent=o.textContent;o.replaceWith(n);}
  if(location.hash.length>1){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)el.scrollIntoView();}}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},b,256));}
const saved=[sessionStorage.getItem('sk'),localStorage.getItem('sk'),localStorage.getItem('mk')].filter(Boolean);
(async()=>{for(const s of saved){try{await show(b64(s));return;}catch(e){}}f.style.visibility='visible';})();
f.addEventListener('submit',async ev=>{ev.preventDefault();const err=document.getElementById('err');err.textContent='Проверяю…';
  const remember=document.getElementById('rm').checked;
  try{const raw=await derive(document.getElementById('pw').value);await show(raw);const r=u64(raw);
    sessionStorage.setItem('sk',r);if(remember)localStorage.setItem('sk',r);}
  catch(e){err.textContent='Неверный пароль';}});
})();
